components:
  schemas:
    AIQuotaUpdateRequest:
      properties:
        gemini_limit:
          anyOf:
          - type: integer
            maximum: 10000000.0
            minimum: 1.0
          - type: 'null'
          title: Gemini Limit
        mathpix_limit:
          anyOf:
          - type: integer
            maximum: 10000000.0
            minimum: 1.0
          - type: 'null'
          title: Mathpix Limit
        minio_storage_limit_mb:
          anyOf:
          - type: number
            maximum: 10000000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Minio Storage Limit Mb
      type: object
      title: AIQuotaUpdateRequest
    AdminLoginRequest:
      properties:
        email:
          type: string
          maxLength: 150
          minLength: 3
          title: Email
          description: Email Quản trị viên
        password:
          type: string
          maxLength: 128
          minLength: 4
          title: Password
          description: Mật khẩu Quản trị viên
      type: object
      required:
      - email
      - password
      title: AdminLoginRequest
    AnswerOptionItem:
      properties:
        label:
          type: string
          title: Label
        content:
          type: string
          title: Content
        is_correct:
          type: boolean
          title: Is Correct
          default: false
        wrong_explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Wrong Explanation
      type: object
      required:
      - label
      - content
      title: AnswerOptionItem
    BenchmarkSummaryResponse:
      properties:
        task_id:
          type: string
          title: Task Id
          default: TF28522
        timestamp:
          type: string
          title: Timestamp
        status:
          type: string
          title: Status
        stroke_latency:
          additionalProperties: true
          type: object
          title: Stroke Latency
        ai_response_normal:
          additionalProperties: true
          type: object
          title: Ai Response Normal
        ai_response_degraded:
          additionalProperties: true
          type: object
          title: Ai Response Degraded
        formula_accuracy:
          additionalProperties: true
          type: object
          title: Formula Accuracy
        multi_room_isolation:
          additionalProperties: true
          type: object
          title: Multi Room Isolation
        all_criteria_met:
          type: boolean
          title: All Criteria Met
      type: object
      required:
      - timestamp
      - status
      - stroke_latency
      - ai_response_normal
      - ai_response_degraded
      - formula_accuracy
      - multi_room_isolation
      - all_criteria_met
      title: BenchmarkSummaryResponse
    Body_upload_exam_file_api_v1_exam_upload_post:
