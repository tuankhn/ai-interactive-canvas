          default: 100
          title: Simulated Strokes Count
        description: Số nét vẽ mô phỏng để đo độ trễ
      - name: degraded_latency_ms
        in: query
        required: false
        schema:
          type: number
          maximum: 4000.0
          minimum: 500.0
          description: Độ trễ mạng yếu giả lập (ms)
          default: 2200.0
          title: Degraded Latency Ms
        description: Độ trễ mạng yếu giả lập (ms)
