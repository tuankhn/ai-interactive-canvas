    post:
      tags:
      - Performance & Multi-room Isolation Benchmarks (TF28522)
      summary: 'TF28522: Chạy kiểm thử toàn diện hiệu năng, độ trễ và cô lập dữ liệu
        2 phòng học'
      description: 'Thực hiện kiểm thử thực tế và định lượng toàn diện cho Task TF28522:

        1. Độ trễ nét bút (< 16ms, 60 FPS).

        2. Thời gian AI trả kết quả (<= 2s mạng thường, <= 5s mạng yếu).

        3. Nhận diện đúng >= 90% công thức phổ thông (tập 30 công thức Toán - Lý -
        Hóa).

        4. Kiểm tra cô lập dữ liệu 2 phòng học chạy song song (Zero data cross-leakage).'
      operationId: run_full_benchmark_api_v1_benchmark_run_full_audit_post
