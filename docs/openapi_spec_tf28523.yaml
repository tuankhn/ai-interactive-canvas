openapi: 3.1.0
info:
  title: AI Interactive Canvas API
  description: Backend API & WebSocket cho Bảng vẽ thông minh hỗ trợ giảng dạy (AI
    Interactive Canvas)
  version: 1.0.0
paths:
  /api/v1/recognize:
    post:
      tags:
      - AI Recognition
      summary: Nhận diện nét viết tay sau khi dừng bút 800ms (debounce)
      description: Nhận chuỗi Base64 ảnh nét vẽ từ bảng tương tác All-in-one, gọi
        Gemini 2.5 Flash / Mathpix OCR bóc tách công thức LaTeX và trả kết quả dưới
        2 giây.
      operationId: recognize_strokes_api_v1_recognize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecognizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/canvas/recognize:
    post:
      tags:
      - AI Recognition
      summary: Endpoint nhận diện nét viết tay cho Canvas tương thích đa định dạng
      description: 'Endpoint tương thích cho SmartCanvas và các kịch bản kiểm thử:

        Hỗ trợ nhận cả RecognizeRequest đầy đủ hoặc payload tối giản ({image_base64,
        subject}).'
      operationId: canvas_recognize_alias_api_v1_canvas_recognize_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Payload
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/canvas/preprocess:
    post:
      tags:
      - AI Recognition
      summary: Tiền xử lý nét vẽ Canvas (Bounding box, làm mịn, nén WebP)
      description: 'Cắt sát vùng nét vẽ (Bounding box), loại bỏ viền trống 4K/FHD
        và nén WebP

        giảm 60-85% dung lượng trước khi gửi sang Gemini / Mathpix.'
      operationId: preprocess_canvas_api_v1_canvas_preprocess_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreprocessCanvasRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreprocessCanvasResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recognize/debounce-config:
    get:
      tags:
      - AI Recognition
      summary: Lấy cấu hình thời gian Debounce dừng bút và giới hạn độ trễ AI
      description: 'Trả về cấu hình tiêu chuẩn cho Màn hình tương tác thông minh All-in-one:

        - debounce_ms: 800ms (thời gian chờ người dùng nhấc bút trước khi gửi API).

        - max_latency_ms: 2000ms (hạn mức thời gian AI trả kết quả).'
      operationId: get_debounce_config_api_v1_recognize_debounce_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/recognize/providers:
    get:
      tags:
      - AI Recognition
      summary: Kiểm tra trạng thái kết nối các nhà cung cấp AI (Gemini 2.5 Flash &
        Mathpix)
      description: Kiểm tra tính sẵn sàng của Gemini 2.5 Flash và Mathpix OCR API.
      operationId: get_providers_status_api_v1_recognize_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/illustrate:
    post:
      tags:
      - AI Recognition
      summary: Tạo hình ảnh minh họa nét phấn trắng cho từ vựng và khái niệm (Task
        TF2850F)
      description: Khi giáo viên viết từ vựng Tiếng Anh hoặc khái niệm Sinh, Địa (như
        Photosynthesis, Solar System, Volcano), gọi AI tạo hình minh họa nét vẽ phấn
        trắng và đặt cạnh từ vựng.
      operationId: create_illustration_api_v1_illustrate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IllustrationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IllustrationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/canvas/illustrate:
    post:
      tags:
      - AI Recognition
      summary: Endpoint tương thích tạo ảnh minh họa phấn trắng cho SmartCanvas
      operationId: canvas_illustrate_alias_api_v1_canvas_illustrate_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Payload
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/canvas/correct-token:
    post:
      tags:
      - AI Recognition
      summary: Sửa ký tự mơ hồ hoặc công thức nhận diện chưa chuẩn
      description: Tiếp nhận sửa lỗi ký tự từ popup gợi ý trên bảng vẽ và cập nhật
        biểu thức LaTeX.
      operationId: correct_token_api_v1_canvas_correct_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/pages:
    post:
      tags:
      - Board Pages & Snapshots (MinIO + PostgreSQL)
      summary: Save Board Page
      description: Lưu trạng thái trang bảng vẽ theo session_id và room_id (FR-CAN-03,
        NFR-SCALE-01).
      operationId: save_board_page_api_v1_sessions_pages_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageSaveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/pages/{room_id}/{session_id}:
    get:
      tags:
      - Board Pages & Snapshots (MinIO + PostgreSQL)
      summary: Get Board Pages
      description: Lấy danh sách các trang bảng trong phiên học hiện tại (kiểm tra
        phân quyền lớp nếu là HS/PH).
      operationId: get_board_pages_api_v1_sessions_pages__room_id___session_id__get
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          title: Room Id
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/snapshots:
    post:
      tags:
      - Board Pages & Snapshots (MinIO + PostgreSQL)
      summary: Save Snapshot
      description: 'Task TF2850E: Xuất ảnh bảng độ phân giải cao (.webp/.png) lưu
        vào MinIO khi bấm Lưu bài hoặc Xóa bảng.

        Tự động gắn thẻ giáo viên, lớp, môn, ngày giờ, tiết học và lưu nội dung OCR
        vào DB để tìm kiếm (lưu tối thiểu 6 tháng).'
      operationId: save_snapshot_api_v1_sessions_snapshots_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotSaveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Board Pages & Snapshots (MinIO + PostgreSQL)
      summary: List Snapshots
      description: Truy vấn và tìm kiếm danh sách Snapshot theo lớp, môn học, ngày
        học, phòng học và nội dung OCR.
      operationId: list_snapshots_api_v1_sessions_snapshots_get
      parameters:
      - name: class_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Lọc theo tên lớp (vd: 10A1)'
          title: Class Name
        description: 'Lọc theo tên lớp (vd: 10A1)'
      - name: subject
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Lọc theo môn học (vd: TOAN)'
          title: Subject
        description: 'Lọc theo môn học (vd: TOAN)'
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo ngày YYYY-MM-DD
          title: Date
        description: Lọc theo ngày YYYY-MM-DD
      - name: room_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Lọc theo phòng học (vd: room-10a1)'
          title: Room Id
        description: 'Lọc theo phòng học (vd: room-10a1)'
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo phiên học
          title: Session Id
        description: Lọc theo phiên học
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Tìm kiếm theo nội dung văn bản OCR / LaTeX
          title: Q
        description: Tìm kiếm theo nội dung văn bản OCR / LaTeX
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 24
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/snapshots/{snapshot_id}/image:
    get:
      tags:
      - Board Pages & Snapshots (MinIO + PostgreSQL)
      summary: 'TF2851F: Xem & Tải ảnh bảng độ nét cao (PNG/WebP)'
      operationId: get_snapshot_image_api_v1_sessions_snapshots__snapshot_id__image_get
      parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          title: Snapshot Id
      - name: format
        in: query
        required: false
        schema:
          type: string
          description: 'Định dạng ảnh trả về: webp hoặc png'
          default: webp
          title: Format
        description: 'Định dạng ảnh trả về: webp hoặc png'
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Bật true để tải file về máy
          default: false
          title: Download
        description: Bật true để tải file về máy
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: JWT dự phòng khi tải bằng thẻ <img> hoặc <a download>
          title: Token
        description: JWT dự phòng khi tải bằng thẻ <img> hoặc <a download>
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/teacher/register:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: Đăng ký tài khoản Giáo viên (băm mật khẩu Argon2/BCrypt)
      operationId: register_teacher_api_v1_auth_teacher_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherRegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/request-otp:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: Giáo viên nhập Email & SĐT để nhận mã OTP 6 số qua Email
      operationId: request_otp_api_v1_auth_request_otp_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOTPRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/verify-otp:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: Xác thực OTP 6 số và giữ phiên 14 ngày trên thiết bị phòng học
      operationId: verify_otp_api_v1_auth_verify_otp_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/teacher/login-password:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: Đăng nhập Giáo viên bằng mật khẩu băm Argon2/BCrypt
      operationId: teacher_login_password_api_v1_auth_teacher_login_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherPasswordLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/student/register:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: 'TF28515: Đăng ký SĐT Học sinh (THCS/THPT) hoặc Phụ huynh (Tiểu học)
        — 1 học sinh/1 tài khoản'
      operationId: register_student_or_parent_api_v1_auth_student_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentParentRegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/student/login:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: 'TF28515: Đăng nhập Học sinh/Phụ huynh bằng SĐT & mật khẩu kèm phân
        quyền lớp'
      operationId: login_student_or_parent_api_v1_auth_student_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentParentLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/forgot-password/request-otp:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: 'TF28515: Yêu cầu mã OTP 6 số lấy lại mật khẩu qua SĐT'
      operationId: forgot_password_request_otp_api_v1_auth_forgot_password_request_otp_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordOTPRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/forgot-password/reset:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: 'TF28515: Xác thực OTP và đặt lại mật khẩu mới (băm Argon2/BCrypt)'
      operationId: forgot_password_reset_api_v1_auth_forgot_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordOTPRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/student/lessons:
    get:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: 'TF28515 / TF2851F: Xem bài học (Snapshot) giới hạn theo đúng lớp của
        Học sinh/Phụ huynh'
      operationId: list_student_class_lessons_api_v1_auth_student_lessons_get
      parameters:
      - name: class_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Tên lớp cần xem (mặc định lớp của học sinh)
          title: Class Name
        description: Tên lớp cần xem (mặc định lớp của học sinh)
      - name: subject
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Lọc theo ngày YYYY-MM-DD
          title: Date
        description: Lọc theo ngày YYYY-MM-DD
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Tìm kiếm theo công thức OCR/LaTeX hoặc tên giáo viên
          title: Q
        description: Tìm kiếm theo công thức OCR/LaTeX hoặc tên giáo viên
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 24
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication, 14-Day Session & Student/Parent RBAC (TF28514, TF28515)
      summary: Làm mới Access Token trong thời hạn duy trì 14 ngày
      operationId: refresh_session_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
